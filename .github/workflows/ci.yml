name: CI/CD

# Déclencheurs du cours : push et pull request sur main, dev et feature/**.
on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. CI : les tests Jest (npm test) bloquent la suite si l'un d'eux échoue.
  test:
    name: Tests (frontend et API Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Jest exécute les tests de src/ (frontend) et de backend/ (API Express + SQLite temporaire).
      - name: Tests Jest avec couverture
        run: npm run test:coverage
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jest
          path: coverage/
          retention-days: 7

  # 2. Build : ne démarre que si les tests réussissent (needs).
  build:
    name: Build de production
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7

  # 3. CD : déploiement sur Vercel seulement sur main, après le build.
  deploy:
    name: Déploiement Vercel
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier les secrets Vercel
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Secret VERCEL_TOKEN manquant"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Secret VERCEL_ORG_ID manquant"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Secret VERCEL_PROJECT_ID manquant"; exit 1; }
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
